<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Motion Lines -->
  <line x1="20" y1="80" x2="120" y2="80" stroke="url(#purpleGradient)" stroke-width="12" stroke-linecap="round" opacity="0.5"/>
  <line x1="30" y1="110" x2="130" y2="110" stroke="url(#purpleGradient)" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <line x1="40" y1="140" x2="140" y2="140" stroke="url(#purpleGradient)" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
  <line x1="30" y1="170" x2="130" y2="170" stroke="url(#purpleGradient)" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <line x1="20" y1="200" x2="120" y2="200" stroke="url(#purpleGradient)" stroke-width="12" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Sneaker Shape -->
  <g transform="translate(150, 60)">
    <!-- Main Sneaker Body -->
    <path d="M 20 120 Q 30 90, 60 70 L 120 60 Q 160 55, 200 70 L 240 90 Q 250 100, 250 120 L 250 140 Q 250 155, 240 165 L 20 165 Q 10 155, 10 140 L 10 130 Q 10 120, 20 120 Z" 
          fill="url(#purpleGradient)" opacity="0.95"/>
    
    <!-- Sneaker Sole -->
    <ellipse cx="130" cy="180" rx="130" ry="20" fill="url(#purpleGradient)" opacity="0.9"/>
    
    <!-- Sneaker Details -->
    <path d="M 70 90 Q 90 80, 110 80 Q 130 80, 150 90" stroke="white" stroke-width="3" fill="none" opacity="0.7"/>
    <circle cx="200" cy="100" r="5" fill="white" opacity="0.8"/>
    <circle cx="185" cy="105" r="4" fill="white" opacity="0.6"/>
  </g>
  
  <!-- MOTION WEAR Text -->
  <text x="500" y="180" font-family="'Arial Black', 'Helvetica', sans-serif" font-size="110" font-weight="900" fill="url(#purpleGradient)" letter-spacing="8">
    MOTION WEAR
  </text>
</svg>
