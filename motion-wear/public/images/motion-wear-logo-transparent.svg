<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Motion Lines (left side) -->
  <line x1="20" y1="60" x2="80" y2="60" stroke="url(#purpleGradient)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <line x1="30" y1="80" x2="90" y2="80" stroke="url(#purpleGradient)" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <line x1="40" y1="100" x2="100" y2="100" stroke="url(#purpleGradient)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <line x1="30" y1="120" x2="90" y2="120" stroke="url(#purpleGradient)" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <line x1="20" y1="140" x2="80" y2="140" stroke="url(#purpleGradient)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Sneaker Shape -->
  <g transform="translate(110, 40)">
    <!-- Sneaker Body -->
    <path d="M10 90 Q20 70, 40 60 L80 55 Q100 53, 120 60 L140 70 Q145 75, 145 85 L145 100 Q145 110, 140 115 L10 115 Q5 110, 5 100 L5 95 Q5 88, 10 90Z" 
          fill="url(#purpleGradient)" opacity="0.9"/>
    
    <!-- Sneaker Sole -->
    <ellipse cx="75" cy="120" rx="75" ry="12" fill="url(#purpleGradient)" opacity="0.95"/>
    
    <!-- Sneaker Details -->
    <path d="M40 70 Q50 65, 60 65 Q70 65, 80 70" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>
    <circle cx="120" cy="75" r="3" fill="#ffffff" opacity="0.8"/>
  </g>
  
  <!-- MOTION WEAR Text -->
  <text x="320" y="110" font-family="'Inter', 'Arial Black', sans-serif" font-size="72" font-weight="900" fill="url(#purpleGradient)" letter-spacing="2">
    MOTION WEAR
  </text>
</svg>
